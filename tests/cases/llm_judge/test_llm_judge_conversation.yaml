name: llm-judge-conversation-test
description: Tests the integration of LLM-based judge assertions for whole conversations in catnip test cases.
skip: false

expect_llm_judge:
  - "The bot should provide interesting facts about dogs"
  - "The bot should provide interesting facts about cats"
  - "The bot never provides any information about dungeons and dragons"

phases:
  - send: "Hello! Tell me something interesting about cats."
  - send: "Now tell me something interesting about dogs."
